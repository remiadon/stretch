[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stretch-tscd"
version = "0.1.1"
description = "Causal discovery for nonstationary time series with varying causal delays"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
  {name = "Lénaïg Cornanguer"},
  {name = "David Kaltenpoth"},
  {name = "Jilles Vreeken"},
]
keywords = ["causal discovery", "time series", "time-varying delays"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jax>=0.8",
  "networkx>=3.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.2",
  "scipy>=1.10",
]

[project.scripts]
stretch = "stretch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/lcornanguer/stretch"
Repository = "https://github.com/lcornanguer/stretch"
Issues = "https://github.com/lcornanguer/stretch/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-benchmark>=5.3.1",
    "pytest-memray>=1.11.0",
]

[tool.pytest.ini_options]
# Every run saves timings to .benchmarks/<OS-Python-version>/NNNN_*.json and fails if any
# case's `min` time is >10% slower than run 0001, the upstream baseline (0001_upstream.json).
# Timings only compare within one OS/Python version. To record the baseline for a new one,
# check out upstream (a55e9d9) and run: pytest -o addopts="" --benchmark-save=upstream
addopts = "--benchmark-autosave --benchmark-compare=0001 --benchmark-compare-fail=min:10%"
